# Intégration continue : à chaque push et pull request,
# vérification des types, tests du moteur et build de production.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
